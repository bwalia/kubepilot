---
# ── Layout on the target host (matches deploy/systemd/kubepilot.service) ──────
kubepilot_user: kubepilot
kubepilot_install_dir: /opt/kubepilot
kubepilot_config_dir: /etc/kubepilot
kubepilot_state_dir: /var/lib/kubepilot
kubepilot_runbooks_dir: /etc/kubepilot/runbooks
kubepilot_dashboard_port: 8383

# ── Build artifact on the controller (the GitHub runner) ─────────────────────
# The deploy workflow downloads the built binary + dashboard into <repo>/artifact.
# playbook_dir is deploy/ansible, so ../../artifact resolves to the repo root.
kubepilot_artifact_dir: "{{ playbook_dir }}/../../artifact"
kubepilot_binary_src: "{{ kubepilot_artifact_dir }}/kubepilot"
kubepilot_dashboard_src: "{{ kubepilot_artifact_dir }}/dashboard-out/"

# ── Service configuration (rendered into /etc/kubepilot/kubepilot.env) ───────
# Secrets default to environment variables set by the workflow so they never
# appear on the command line or in the inventory.
kubepilot_auth_username: "{{ lookup('env', 'KUBEPILOT_AUTH_USERNAME') | default('admin', true) }}"
kubepilot_auth_password: "{{ lookup('env', 'KUBEPILOT_AUTH_PASSWORD') | default('', true) }}"
kubepilot_auth_token: "{{ lookup('env', 'KUBEPILOT_AUTH_TOKEN') | default('', true) }}"
kubepilot_ollama_base_url: "{{ lookup('env', 'KUBEPILOT_OLLAMA_BASE_URL') | default('http://localhost:11434/v1', true) }}"
kubepilot_ollama_model: "{{ lookup('env', 'KUBEPILOT_OLLAMA_MODEL') | default('llama3', true) }}"
kubepilot_cors_allowed_origins: "{{ lookup('env', 'KUBEPILOT_CORS_ALLOWED_ORIGINS') | default('', true) }}"

# ── Telemetry ────────────────────────────────────────────────────────────────
# Empty endpoint means no OTLP export: tracing is a no-op and metrics stay local
# to /metrics, which is the right default for a host with no collector on its
# network. kubepilot_otel_environment names the host in a shared backend and
# defaults to the inventory group (int / test), so the two boxes are
# distinguishable without any extra configuration.
kubepilot_otel_endpoint: "{{ lookup('env', 'KUBEPILOT_OTEL_ENDPOINT') | default('', true) }}"
kubepilot_otel_protocol: "{{ lookup('env', 'KUBEPILOT_OTEL_PROTOCOL') | default('grpc', true) }}"
kubepilot_otel_insecure: "{{ lookup('env', 'KUBEPILOT_OTEL_INSECURE') | default('true', true) }}"
kubepilot_otel_sample_ratio: "{{ lookup('env', 'KUBEPILOT_OTEL_SAMPLE_RATIO') | default('1.0', true) }}"
kubepilot_otel_service_namespace: "{{ lookup('env', 'KUBEPILOT_OTEL_SERVICE_NAMESPACE') | default('home-lab', true) }}"
kubepilot_otel_environment: "{{ lookup('env', 'KUBEPILOT_OTEL_ENVIRONMENT') | default(group_names | first | default('unknown'), true) }}"
kubepilot_metrics_enabled: "{{ lookup('env', 'KUBEPILOT_METRICS_ENABLED') | default('true', true) }}"
kubepilot_metrics_require_auth: "{{ lookup('env', 'KUBEPILOT_METRICS_REQUIRE_AUTH') | default('false', true) }}"
# Kubeconfig KubePilot itself uses to reach a cluster (the app's own access,
# unrelated to how it is deployed). `kubepilot serve` reads the standard
# KUBECONFIG env var and fails to start without a readable kubeconfig, so the
# role provisions one at this path.
kubepilot_kubeconfig_path: "{{ kubepilot_config_dir }}/kubeconfig.yaml"
# Where to source it from:
#  - If KUBECONFIG_CONTENT is set (a base64-encoded kubeconfig, e.g. a CI
#    secret), it is decoded and written.
#  - Otherwise the on-host kubeconfig at kubepilot_source_kubeconfig is copied
#    (defaults to the k3s admin config).
kubepilot_kubeconfig_content: "{{ lookup('env', 'KUBECONFIG_CONTENT') | default('', true) }}"
kubepilot_source_kubeconfig: /etc/rancher/k3s/k3s.yaml
