# KubePilot home-lab deploy targets.
#
# Each host runs KubePilot as a systemd service (see roles/kubepilot). The
# deploy workflow SSHes in as `bwalia` and uses sudo to install the unit, so
# `bwalia` needs passwordless sudo on these boxes.
#
# Promotion order is enforced by the workflow (test only after int succeeds),
# not by this file.

[int]
192.168.1.193

[test]
192.168.1.140

[kubepilot:children]
int
test

[kubepilot:vars]
ansible_user=bwalia
ansible_python_interpreter=/usr/bin/python3
