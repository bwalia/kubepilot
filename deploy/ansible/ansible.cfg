# Ansible config for KubePilot home-lab systemd deploys.
# Used by .github/workflows/deploy.yml; safe to run by hand too:
#   cd deploy/ansible && ansible-playbook site.yml --limit int
[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
deprecation_warnings = False

[ssh_connection]
pipelining = True
