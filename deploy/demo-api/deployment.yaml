apiVersion: v1
kind: Secret
metadata:
  name: kubepilot-demo-auth
  namespace: kubepilot-demo
  labels:
    app.kubernetes.io/name: kubepilot-demo-api
type: Opaque
stringData:
  # Rotate after App Review approval.
  DEMO_USER: apple
  DEMO_PASSWORD: review
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepilot-demo-api
  namespace: kubepilot-demo
  labels:
    app.kubernetes.io/name: kubepilot-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubepilot-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubepilot-demo-api
    spec:
      containers:
        - name: demo-api
          image: docker.io/bwalia/kubepilot-demo-api:8a521e7@sha256:5729ad866718f553b5c5d2ea185c9372e10b47115b18bbdbcb1c382fdf58ff7a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8383
          env:
            - name: DEMO_API_ADDR
              value: ":8383"
            - name: DEMO_USER
              valueFrom:
                secretKeyRef:
                  name: kubepilot-demo-auth
                  key: DEMO_USER
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubepilot-demo-auth
                  key: DEMO_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
---
apiVersion: v1
kind: Service
metadata:
  name: kubepilot-demo-api
  namespace: kubepilot-demo
  labels:
    app.kubernetes.io/name: kubepilot-demo-api
spec:
  selector:
    app.kubernetes.io/name: kubepilot-demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubepilot-demo-api
  namespace: kubepilot-demo
  labels:
    app.kubernetes.io/name: kubepilot-demo-api
  annotations:
    # kubepilot.org is not in ExternalDNS domain-filter; keep the annotation
    # for discoverability and use deploy/wslproxy + Cloudflare CNAME (docs).
    external-dns.alpha.kubernetes.io/hostname: demo.kubepilot.org
spec:
  ingressClassName: traefik-edge
  rules:
    - host: demo.kubepilot.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubepilot-demo-api
                port:
                  number: 80
