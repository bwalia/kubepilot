name: KubePilot
options:
  bundleIdPrefix: io.kubepilot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  KubePilot:
    type: application
    platform: iOS
    sources:
      - path: KubePilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kubepilot.app
        INFOPLIST_KEY_CFBundleDisplayName: KubePilot
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your KubePilot credentials with Face ID"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    dependencies:
      - target: KubePilotWidgets
        embed: true
    entitlements:
      path: KubePilot/KubePilot.entitlements

  KubePilotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KubePilotWidgets
        excludes:
          - Info.plist
    info:
      path: KubePilotWidgets/Info.plist
      properties:
        CFBundleDisplayName: KubePilot Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kubepilot.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KubePilotWidgets/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
    entitlements:
      path: KubePilotWidgets/KubePilotWidgets.entitlements

  KubePilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KubePilotTests
    dependencies:
      - target: KubePilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kubepilot.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KubePilot:
    build:
      targets:
        KubePilot: all
        KubePilotTests: [test]
    test:
      targets:
        - KubePilotTests
