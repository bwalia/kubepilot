## node-labeler — stamps each node with its real, non-WireGuard LAN IP as the
## label kubepilot.io/lan-ip. On WireGuard-meshed k3s clusters, Kubernetes only
## knows the WireGuard address as a node's internal IP, so the physical LAN IP is
## otherwise absent from the node object. KubePilot's dashboard trusts this label
## to show the correct LAN address (and to demote the WireGuard address to Tunnel).
##
## Detection: the source address of the default route (`ip route get 1.1.1.1`),
## which on a homelab node is the physical LAN IP, not the WireGuard tunnel.
## The pod runs with hostNetwork so it sees the host's real routing table, and
## patches its own node via the API server using its ServiceAccount token.
##
## The image is stock alpine plus iproute2 + curl installed at start; swap it for
## a prebuilt image that already bundles both if your nodes lack egress.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-labeler
  namespace: kubepilot-system
  labels:
    app.kubernetes.io/managed-by: kubepilot
    app.kubernetes.io/name: node-labeler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-labeler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-labeler
    spec:
      serviceAccountName: node-labeler
      hostNetwork: true
      # With hostNetwork the pod would otherwise use the host's DNS and fail to
      # resolve in-cluster names; this lets it use cluster DNS. The API address
      # below is taken from injected env vars (an IP), so DNS isn't relied on.
      dnsPolicy: ClusterFirstWithHostNet
      # Run on every node, including tainted control-plane nodes.
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: false
      containers:
        - name: node-labeler
          image: alpine:3.20
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # How often to re-apply the label (seconds); the label self-heals if
            # the LAN IP changes or is removed.
            - name: INTERVAL
              value: "300"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache iproute2 curl >/dev/null 2>&1 || true
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              while true; do
                IP=$(ip -4 -o route get 1.1.1.1 2>/dev/null | grep -oE 'src [0-9.]+' | awk '{print $2}')
                case "$IP" in
                  10.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[0-1].*)
                    if curl -sS --fail --cacert "$SA/ca.crt" \
                        -H "Authorization: Bearer $(cat $SA/token)" \
                        -H "Content-Type: application/merge-patch+json" \
                        -X PATCH "$API/api/v1/nodes/$NODE_NAME" \
                        -d "{\"metadata\":{\"labels\":{\"kubepilot.io/lan-ip\":\"$IP\"}}}" \
                        -o /dev/null; then
                      echo "labeled node $NODE_NAME kubepilot.io/lan-ip=$IP"
                    else
                      echo "patch failed for node $NODE_NAME (ip=$IP)"
                    fi
                    ;;
                  *)
                    echo "no private LAN IP detected on $NODE_NAME (got '${IP:-none}'); skipping"
                    ;;
                esac
                sleep "${INTERVAL}"
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
