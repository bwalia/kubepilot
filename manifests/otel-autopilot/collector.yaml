## OTEL Collector for KubePilot OTLP Autopilot (Hybrid).
## Receives OTLP, enriches with k8s metadata, dual-writes to:
##   1) KubePilot managed store (/api/v1/otel/ingest) — default UI path
##   2) Optional Prometheus/Thanos/Cortex remote_write when configured
##
## Apply:
##   kubectl apply -f manifests/otel-autopilot/
apiVersion: v1
kind: Namespace
metadata:
  name: kubepilot-system
  labels:
    app.kubernetes.io/managed-by: kubepilot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: kubepilot-system
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/managed-by: kubepilot
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: end
        include_file_path: true
        operators:
          - type: container
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
      resource:
        attributes:
          - key: kubepilot.plane
            value: application
            action: upsert
    exporters:
      # Hybrid default: push a compact JSON summary into KubePilot managed store.
      otlphttp/kubepilot:
        endpoint: ${env:KUBEPILOT_OTLP_HTTP_ENDPOINT}
        tls:
          insecure: true
      # Optional Prometheus / Thanos / Cortex remote_write (set REMOTE_WRITE_URL).
      prometheusremotewrite:
        endpoint: ${env:REMOTE_WRITE_URL}
        tls:
          insecure: true
      logging:
        loglevel: info
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/kubepilot, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/kubepilot, prometheusremotewrite, logging]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/kubepilot, logging]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: kubepilot-system
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/managed-by: kubepilot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      serviceAccountName: otel-collector
      tolerations:
        - operator: Exists
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/conf/relay.yaml"]
          env:
            - name: KUBEPILOT_OTLP_HTTP_ENDPOINT
              # Point at the KubePilot service OTLP ingest shim / dashboard API host.
              # Override in real installs; default assumes kubepilot service in this ns.
              value: "http://kubepilot.kubepilot-system.svc:8080/api/v1/otel"
            - name: REMOTE_WRITE_URL
              # Leave empty / unused when not exporting; chart values inject a real URL.
              value: "http://127.0.0.1:9/dev/null"
          ports:
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
          volumeMounts:
            - name: conf
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: conf
          configMap:
            name: otel-collector-config
            items:
              - key: relay.yaml
                path: relay.yaml
        - name: varlogpods
          hostPath:
            path: /var/log/pods
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: kubepilot-system
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: kubepilot-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: kubepilot-system
