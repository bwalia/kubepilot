## ─────────────────────────────────────────────────────────────────────────────
## KubePilot Helm Chart – values.yaml
## Override any value with --set or a custom values file.
## ─────────────────────────────────────────────────────────────────────────────

replicaCount: 1

image:
  repository: ghcr.io/kubepilot/kubepilot
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Service ─────────────────────────────────────────────────────────────────
# Supported types: ClusterIP, NodePort, LoadBalancer.
# For quick local access:   type: NodePort  + nodePort values below.
# For production + ingress: type: ClusterIP + ingress.enabled=true.
service:
  type: ClusterIP
  dashboardPort: 8080
  mcpPort: 9090
  # NodePort values — only used when service.type=NodePort (range 30000-32767).
  nodePorts:
    dashboard: ""   # e.g. 30080
    mcp: ""         # e.g. 30090
  annotations: {}

# ── Ingress ──────────────────────────────────────────────────────────────────
# Enable to expose the dashboard via a domain name.
# Requires an Ingress controller (nginx, traefik, etc.) installed in the cluster.
ingress:
  enabled: false
  className: "nginx"   # Set to your ingress class: nginx | traefik | haproxy | etc.
  annotations: {}
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: kubepilot.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: kubepilot-tls
  #   hosts:
  #     - kubepilot.local

# ── KubePilot configuration ──────────────────────────────────────────────────
kubepilot:
  # Ollama base URL. Default targets an Ollama running on the host machine,
  # reachable from inside the cluster via host.docker.internal (works with
  # Rancher Desktop / Docker Desktop k3s). For an in-cluster Ollama service,
  # override with its service DNS, e.g. http://ollama.monitoring:11434/v1.
  ollamaBaseURL: "http://host.docker.internal:11434/v1"

  # Ollama model name: llama3.1:8b | tinyllama | mistral | codellama | etc.
  # llama3.1:8b (~5GB) gives solid RCA quality and runs comfortably on a
  # 16GB+ machine; drop to tinyllama for very memory-constrained hosts.
  ollamaModel: "llama3.1:8b"

  # ollamaAPIKeySecret is optional — only required if Ollama is behind an auth proxy.
  # Set via: --set kubepilot.ollamaAPIKeySecret.name=my-secret
  # NEVER put the key directly in values.yaml.
  ollamaAPIKeySecret:
    name: ""   # Leave empty when using unauthenticated local Ollama.
    key: "api-key"

  # Log level: debug | info | warn | error
  logLevel: "info"

  # ── Dashboard / API authentication ──────────────────────────────────────────
  # When enabled, every dashboard + API route (except /healthz, used by probes)
  # requires either HTTP Basic auth (username + password) or a Bearer token.
  # Credentials are injected from a Kubernetes Secret — they are never passed as
  # CLI args, so they don't leak in `ps` output or the rendered pod spec.
  auth:
    enabled: true

    # Reference an existing Secret that holds the credentials. Recognised keys:
    #   username, password, token  (any subset — supply Basic and/or Bearer).
    # Leave empty to have the chart create a Secret from the inline values below.
    existingSecret: ""

    # Inline credentials — only used when existingSecret is empty. NEVER commit a
    # real password here; pass it at deploy time, e.g.:
    #   --set kubepilot.auth.password=$KUBEPILOT_DASHBOARD_PASSWORD
    # At least one of password (with username) or token must be set when auth is
    # enabled and existingSecret is empty, or the chart install will fail.
    username: "admin"
    password: ""
    token: ""

  # Enable action mutation endpoints (execute-action / remediate / port-forward
  # start+stop). Required for the dashboard's port-forwarding feature.
  enableActionMutations: false

  # Namespaces to monitor for AI-driven troubleshooting. Empty = all namespaces.
  watchNamespaces: []

# ── Operator ─────────────────────────────────────────────────────────────────
operator:
  enabled: true
  leaderElect: true
  metricsPort: 8081
  healthProbePort: 8082

# ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# ── Security ─────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Observability ─────────────────────────────────────────────────────────────
metrics:
  enabled: true
  serviceMonitor:
    enabled: false  # Set to true if Prometheus Operator is installed.
    namespace: monitoring
    interval: 30s

# ── Network Policy ───────────────────────────────────────────────────────────
networkPolicy:
  enabled: false  # Enable to restrict traffic to/from kubepilot pods.

# ── Node scheduling ──────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Pod Disruption Budget ────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: false
  minAvailable: 1
