{{- if and .Values.kubepilot.auth.enabled (not .Values.kubepilot.auth.existingSecret) }}
{{- $hasBasic := and .Values.kubepilot.auth.username .Values.kubepilot.auth.password }}
{{- $hasToken := .Values.kubepilot.auth.token }}
{{- if not (or $hasBasic $hasToken) }}
{{- fail "kubepilot.auth.enabled is true but no credentials were supplied. Set kubepilot.auth.username + kubepilot.auth.password and/or kubepilot.auth.token, or point kubepilot.auth.existingSecret at a Secret you manage." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubepilot.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.kubepilot.auth.username }}
  username: {{ . | quote }}
  {{- end }}
  {{- with .Values.kubepilot.auth.password }}
  password: {{ . | quote }}
  {{- end }}
  {{- with .Values.kubepilot.auth.token }}
  token: {{ . | quote }}
  {{- end }}
{{- end }}
