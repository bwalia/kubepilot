{{- if and .Values.otelAutopilot.enabled .Values.otelAutopilot.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubepilot.fullname" . }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  relay.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
    exporters:
      otlphttp/kubepilot:
        endpoint: http://{{ include "kubepilot.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.dashboardPort }}/api/v1/otel
        tls:
          insecure: true
      {{- if .Values.otelAutopilot.export.metrics.remoteWrite.url }}
      prometheusremotewrite:
        endpoint: {{ .Values.otelAutopilot.export.metrics.remoteWrite.url | quote }}
        tls:
          insecure: true
      {{- end }}
      logging:
        loglevel: info
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/kubepilot, logging]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/kubepilot{{- if .Values.otelAutopilot.export.metrics.remoteWrite.url }}, prometheusremotewrite{{- end }}, logging]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/kubepilot, logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubepilot.fullname" . }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubepilot.fullname" . }}-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubepilot.fullname" . }}-otel-collector
    spec:
      serviceAccountName: {{ include "kubepilot.serviceAccountName" . }}
      containers:
        - name: otel-collector
          image: {{ .Values.otelAutopilot.collector.image | quote }}
          args: ["--config=/conf/relay.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: conf
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: conf
          configMap:
            name: {{ include "kubepilot.fullname" . }}-otel-collector
            items:
              - key: relay.yaml
                path: relay.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubepilot.fullname" . }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  selector:
    app.kubernetes.io/name: {{ include "kubepilot.fullname" . }}-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
{{- end }}
