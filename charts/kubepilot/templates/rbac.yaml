{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubepilot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubepilot.fullname" . }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
rules:
  # Core cluster read access — required for AI cluster context building and the
  # dashboard resource browser / charts overview.
  - apiGroups: [""]
    resources: [pods, pods/log, nodes, services, endpoints, namespaces, events, configmaps, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch]
  # Write access — only for AI-approved actions (scaling, restart, pod deletion).
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # Port-forwarding into pods (kubectl-style tunnels from the dashboard).
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create, get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update, patch]
  # Networking — read access for the service topology graph and Network section.
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  # Batch — read access for the Jobs / CronJobs views and charts overview.
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Storage — read access for StorageClasses (config/storage views, storage charts).
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  # Secrets — metadata only, for the dashboard's Secrets browser. That view
  # surfaces name, type, and key count and never reads Secret values (see the
  # SECURITY note on k8s.Client.ListSecrets), so read access is all it needs.
  #
  # Creating and deleting Secrets is CR code management, which only ever touches
  # the kubepilot-security namespace. Those verbs are granted by a namespaced
  # Role below rather than here, so a KubePilot pod cannot write a Secret
  # anywhere else in the cluster.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # KubePilot CRDs.
  - apiGroups: [kubepilot.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
  # Metrics API.
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  # Operator leader election.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
{{- if .Values.rbac.crCodeNamespace }}
---
# CR code management, scoped to the one namespace that stores them
# (security.CRCodeNamespace). Kept as a Role + RoleBinding so the write verbs
# never apply cluster-wide.
#
# Skipped entirely when rbac.crCodeNamespace is empty, so the chart still
# installs on a cluster that has no CR code namespace. KubePilot then serves
# normally and only the /crcode endpoints are unavailable.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubepilot.fullname" . }}-crcode
  namespace: {{ .Values.rbac.crCodeNamespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubepilot.fullname" . }}-crcode
  namespace: {{ .Values.rbac.crCodeNamespace }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubepilot.fullname" . }}-crcode
subjects:
  - kind: ServiceAccount
    name: {{ include "kubepilot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubepilot.fullname" . }}
  labels:
    {{- include "kubepilot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubepilot.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubepilot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
