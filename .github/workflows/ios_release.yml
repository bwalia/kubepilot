name: iOS Release (TestFlight & App Store)

# Build, sign, and upload the native KubePilot iOS app.
#
#   PRIMARY   : workflow_dispatch — TestFlight internal by default
#   SECONDARY : push a v*.*.* tag
#   APP STORE : workflow_dispatch with target = app_store (after TestFlight QA)
#
# Runs on the self-hosted Mac Studio runner (labels: self-hosted, macOS, ios_cicd).
# Signing secrets are loaded from HashiCorp Vault at build time — nothing stored
# in GitHub. See docs/IOS_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (blank = ios/project.yml)"
        required: false
        default: ""
      target:
        description: "Upload destination"
        required: true
        type: choice
        default: testflight
        options:
          - testflight
          - app_store
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: kubepilot-ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  release:
    name: Build & upload (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'testflight' }})
    runs-on: [self-hosted, macOS, ios_cicd]
    timeout-minutes: 90
    env:
      VAULT_TOKEN_FILE: /Users/balinderwalia/.secrets/acc-vault/login-token.json
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build keychain
        run: |
          set -euo pipefail
          {
            echo "BUILD_KEYCHAIN_PATH=$RUNNER_TEMP/kubepilot-ios.keychain-db"
            echo "BUILD_KEYCHAIN_PASSWORD=$(openssl rand -base64 24)"
            echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Load signing secrets from Vault
        run: |
          chmod +x ./ci/load-ios-vault-secrets.sh
          ./ci/load-ios-vault-secrets.sh

      - name: Install Ruby dependencies
        run: bundle install

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve marketing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            v="$(awk '/MARKETING_VERSION:/{print $2; exit}' project.yml)"
          fi
          echo "Resolved version: $v"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Compute next build number
        id: build
        run: bundle exec fastlane ios ci_build_number

      - name: Prepare code signing
        run: bundle exec fastlane ios prepare_signing

      - name: Build signed IPA
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bundle exec fastlane ios build_ipa

      - name: Upload to TestFlight (internal)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'testflight')
        run: bundle exec fastlane ios beta

      - name: Submit for App Store review
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'app_store'
        run: bundle exec fastlane ios release

      - name: Archive IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubepilot-ios-ipa
          path: ios/build/KubePilot.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$BUILD_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true
          rm -f "${ASC_KEY_FILEPATH:-}" "${DIST_CERT_KEY_FILEPATH:-}" 2>/dev/null || true
          rm -f "${INSTALLED_PROFILE_PATH:-}" "${INSTALLED_WIDGET_PROFILE_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.cer "$RUNNER_TEMP"/*.p12 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/.ios-secrets" "${IOS_SECRETS_DIR:-}" 2>/dev/null || true
