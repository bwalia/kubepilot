name: iOS Release (TestFlight & App Store)

# Build, sign, and upload the native KubePilot iOS app.
#
#   PRIMARY   : workflow_dispatch — TestFlight internal by default
#   SECONDARY : push a v*.*.* tag
#   APP STORE : workflow_dispatch with target = app_store (after TestFlight QA)
#
# Runs on the self-hosted Mac Studio runner (labels: self-hosted, macOS, ios_cicd).
# Signing secrets are loaded from HashiCorp Vault at build time — nothing stored
# in GitHub. See docs/IOS_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (blank = ios/project.yml)"
        required: false
        default: ""
      target:
        description: "Upload destination"
        required: true
        type: choice
        default: testflight
        options:
          - testflight
          - app_store
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: kubepilot-ios-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: ios

jobs:
  release:
    name: Build & upload (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'testflight' }})
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      VAULT_TOKEN_FILE: /Users/balinderwalia/.secrets/acc-vault/login-token.json
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build keychain
        run: |
          set -euo pipefail
          # Persist the signing keychain across runs on the self-hosted runner so
          # fastlane `cert` reuses one Apple Distribution certificate instead of
          # minting a new one each build (Apple caps distribution certs). The
          # password is generated once, kept off the repo and out of the logs.
          pass_file="$HOME/.secrets/kubepilot/keychain-password"
          mkdir -p "$(dirname "$pass_file")"
          if [ ! -s "$pass_file" ]; then
            ( umask 077; openssl rand -base64 24 > "$pass_file" )
          fi
          kc_pass="$(cat "$pass_file")"
          echo "::add-mask::$kc_pass"
          {
            echo "BUILD_KEYCHAIN_PATH=$HOME/Library/Keychains/kubepilot-signing.keychain-db"
            echo "BUILD_KEYCHAIN_PASSWORD=$kc_pass"
            echo "EXPORT_OPTIONS_PLIST=$RUNNER_TEMP/ExportOptions.plist"
          } >> "$GITHUB_ENV"

      - name: Load signing secrets from Vault
        run: |
          chmod +x ./ci/load-ios-vault-secrets.sh
          ./ci/load-ios-vault-secrets.sh

      - name: Install Ruby dependencies
        run: bundle install

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Resolve marketing version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            v="$INPUT_VERSION"
          else
            v="$(awk '/MARKETING_VERSION:/{print $2; exit}' project.yml)"
          fi
          echo "Resolved version: $v"
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"

      - name: Select Xcode
        env:
          APP_STORE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'app_store' }}
        run: |
          set -euo pipefail
          # App Store IPAs built with beta/future SDKs (e.g. iphoneos26.5) often flip to
          # Invalid Binary seconds after Waiting for Review. Prefer GM Xcode 16.x for app_store.
          # Do NOT use sudo xcode-select — set DEVELOPER_DIR for later steps.
          sdk_major_for() {
            local app="$1"
            DEVELOPER_DIR="$app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null \
              | cut -d. -f1
          }
          is_usable() {
            local app="$1"
            [ -d "$app/Contents/Developer" ] || return 1
            local major
            major="$(sdk_major_for "$app")"
            [ -n "$major" ] || return 1
            if [ "${APP_STORE_RELEASE:-false}" = "true" ] && [ "$major" -ge 26 ] 2>/dev/null; then
              echo "Skipping $app (iphoneos SDK major $major — not accepted for App Store on this project)"
              return 1
            fi
            return 0
          }
          selected=""
          for candidate in \
            /Applications/Xcode-16.4.0.app \
            /Applications/Xcode-16.3.0.app \
            /Applications/Xcode-16.2.0.app \
            /Applications/Xcode.app \
            /Applications/Xcode-26.5.0.app \
            /Applications/Xcode-26.4.0.app
          do
            if is_usable "$candidate"; then
              selected="$candidate"
              break
            fi
          done
          if [ -z "$selected" ]; then
            if [ "${APP_STORE_RELEASE:-false}" = "true" ]; then
              echo "::error::No App Store–safe Xcode found. Install Xcode 16.4 GM to /Applications/Xcode-16.4.0.app on this runner (avoid iphoneos26+ SDK)."
            else
              echo "::error::No Xcode.app found under /Applications"
            fi
            exit 1
          fi
          echo "Using $selected"
          echo "DEVELOPER_DIR=$selected/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$selected/Contents/Developer"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          build="$(xcodebuild -version | awk '/Build version/{print $3}')"
          if echo "$build" | grep -Eq '[a-z]$'; then
            echo "::warning::Xcode build $build looks like a beta/RC (letter suffix)."
            if [ "${APP_STORE_RELEASE:-false}" = "true" ]; then
              echo "::error::Refusing App Store release with beta Xcode $build — install GM Xcode 16.4 on the runner."
              exit 1
            fi
          fi

      - name: Compute next build number
        id: build
        run: bundle exec fastlane ios ci_build_number

      - name: Prepare code signing
        run: bundle exec fastlane ios prepare_signing

      - name: Build signed IPA
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bundle exec fastlane ios build_ipa

      - name: Upload to TestFlight (internal)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'testflight')
        run: bundle exec fastlane ios beta

      - name: Submit for App Store review
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'app_store'
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
        run: bundle exec fastlane ios release

      - name: Archive IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubepilot-ios-ipa
          path: ios/build/KubePilot.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          # The signing keychain is intentionally persistent (see Configure build
          # keychain) — lock it rather than delete it so the cert survives.
          security lock-keychain "$BUILD_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$EXPORT_OPTIONS_PLIST" 2>/dev/null || true
          rm -f "${ASC_KEY_FILEPATH:-}" "${DIST_CERT_KEY_FILEPATH:-}" 2>/dev/null || true
          rm -f "${INSTALLED_PROFILE_PATH:-}" "${INSTALLED_WIDGET_PROFILE_PATH:-}" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/*.cer "$RUNNER_TEMP"/*.p12 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/.ios-secrets" "${IOS_SECRETS_DIR:-}" 2>/dev/null || true
