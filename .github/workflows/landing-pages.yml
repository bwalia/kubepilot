name: Deploy Landing Page

# Publishes docs/landing to GitHub Pages:
#   https://bwalia.github.io/kubepilot/
#
# S3 (kubepilot.org) is deployed separately via:
#   AWS_PROFILE=kubepilot aws s3 cp docs/landing/index.html s3://kubepilot-docs/landing/index.html
#   AWS_PROFILE=kubepilot aws s3 sync docs/screenshots/ s3://kubepilot-docs/screenshots/

on:
  push:
    branches: [master]
    paths:
      - "docs/landing/**"
      - "docs/screenshots/**"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/screenshots
          sed 's|\.\./screenshots/|screenshots/|g' docs/landing/index.html > _site/index.html
          cp docs/screenshots/*.svg _site/screenshots/ 2>/dev/null || true
          cp docs/screenshots/README.md _site/screenshots/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
