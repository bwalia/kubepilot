name: Deploy Landing Page

# Publishes docs/landing + docs/blog to GitHub Pages:
#   https://pages.kubepilot.org/
#   https://pages.kubepilot.org/blog/
#
# Blog HTML is generated from local post packs (+ opsapi CMS when available)
# via scripts/cms/build-blog.mjs — same authoring model as workstation-website.

on:
  push:
    branches: [master]
    paths:
      - "docs/landing/**"
      - "docs/blog/**"
      - "docs/screenshots/**"
      - "scripts/cms/**"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build blog (local posts + opsapi CMS)
        env:
          # Optional repo Variables; scripts/cms/build-blog.mjs has built-in defaults.
          OPSAPI_URL: ${{ vars.OPSAPI_URL }}
          CMS_NAMESPACE: ${{ vars.CMS_NAMESPACE }}
        run: node scripts/cms/build-blog.mjs --out docs/blog

      - name: Prepare static site
        run: |
          mkdir -p _site/screenshots _site/blog/assets
          sed 's|\.\./screenshots/|screenshots/|g' docs/landing/index.html > _site/index.html
          cp docs/landing/privacy.html _site/privacy.html
          # Generated blog pages + assets only (not posts/ source packs).
          cp docs/blog/index.html _site/blog/index.html
          for f in docs/blog/*.html; do
            base=$(basename "$f")
            [ "$base" = "index.html" ] && continue
            cp "$f" "_site/blog/$base"
          done
          cp -R docs/blog/assets/. _site/blog/assets/
          cp docs/screenshots/*.svg _site/screenshots/ 2>/dev/null || true
          cp docs/screenshots/README.md _site/screenshots/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
