name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Cheap, and both catch things Apple would otherwise catch for us days
      # later: a required-reason API with no declared reason (ITMS-91053), and
      # text that has dropped below WCAG AA on the dark theme.
      - name: Check privacy manifest and contrast
        run: |
          python3 scripts/check_privacy_manifest.py
          python3 scripts/check_contrast.py

      - name: Build
        run: |
          xcodebuild build \
            -project KubePilot.xcodeproj \
            -scheme KubePilot \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Test
        run: |
          xcodebuild test \
            -project KubePilot.xcodeproj \
            -scheme KubePilot \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -quiet
