name: Deploy

# Autodeploys KubePilot to the home-lab hosts as a systemd service via Ansible.
#
#   int env  → bwalia@192.168.1.193
#   test env → bwalia@192.168.1.140
#
# Both deploy jobs run on the Mac Studio runner ([self-hosted, macOS, ARM64]).
# It has ansible installed and LAN reachability to both targets, and is a single
# known-good machine — unlike the "int"/"test" labels, which each span several
# Linux runners where ansible is only present on some, so the job would land on
# a runner without ansible and fail to bootstrap it.
#
# Flow:
#   build       → compile the Go binary + Next.js dashboard once (hosted runner),
#                 upload as an artifact.
#   deploy-int  → on the Mac Studio, download the artifact and run Ansible over
#                 SSH to install/refresh the systemd service on the int host.
#   deploy-test → same for test, but ONLY if int succeeded (`needs: deploy-int`),
#                 so a bad build never reaches test.
#
# This deploys to plain hosts with systemd — no Kubernetes/Helm involved. The
# app's own cluster access (if any) is configured separately via its kubeconfig.
#
# Triggers:
#   - Automatically after "CI" finishes successfully on master.
#   - Manually via workflow_dispatch.
#
# Required secrets (per environment unless noted):
#   DASHBOARD_AUTH_PASSWORD   dashboard password (auth is on by default)
#   DASHBOARD_AUTH_USERNAME   optional, defaults to "admin"
# SSH auth: the Mac Studio runner uses its own ~/.ssh key (already authorized for
#   `bwalia` on the targets), so no DEPLOY_SSH_KEY secret is needed. If you ever
#   run this on a different runner, set DEPLOY_SSH_KEY and the script will use it.
# Prerequisite on each host: `bwalia` has passwordless sudo.

on:
  workflow_run:
    # Gate on CI passing (not Docker publishing) so home-lab deploys are
    # independent of the container image build.
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Never run two home-lab deploys at once.
concurrency:
  group: deploy-homelab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Build the binary + dashboard once, ship as an artifact ──────────────────
  build:
    name: Build binary + dashboard
    # Only proceed on a manual run, or when the image publish actually succeeded.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For workflow_run events, deploy the exact commit that was built.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard (static export)
        working-directory: dashboard
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build kubepilot binary
        run: |
          set -euo pipefail
          mkdir -p artifact/dashboard-out
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X github.com/kubepilot/kubepilot/internal/version.Version=${VERSION}" \
            -o artifact/kubepilot ./cmd/kubepilot
          # The binary serves ./dashboard/out relative to its working dir.
          cp -r dashboard/out/. artifact/dashboard-out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubepilot-dist
          path: artifact/
          retention-days: 3

  # ── int env (bwalia@192.168.1.193) ──────────────────────────────────────────
  deploy-int:
    name: Deploy → int (192.168.1.193)
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    environment: int
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kubepilot-dist
          path: artifact

      - name: Deploy with Ansible (systemd)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          KUBEPILOT_AUTH_USERNAME: ${{ secrets.DASHBOARD_AUTH_USERNAME || 'admin' }}
          KUBEPILOT_AUTH_PASSWORD: ${{ secrets.DASHBOARD_AUTH_PASSWORD }}
          # Optional: base64-encoded kubeconfig for the app to reach its cluster.
          # If unset, the role copies the on-host kubeconfig (k3s by default).
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: ./scripts/ansible-deploy.sh int

  # ── test env (bwalia@192.168.1.140) — only if int succeeded ─────────────────
  deploy-test:
    name: Deploy → test (192.168.1.140)
    needs: deploy-int
    runs-on: [self-hosted, macOS, ARM64]
    environment: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kubepilot-dist
          path: artifact

      - name: Deploy with Ansible (systemd)
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          KUBEPILOT_AUTH_USERNAME: ${{ secrets.DASHBOARD_AUTH_USERNAME || 'admin' }}
          KUBEPILOT_AUTH_PASSWORD: ${{ secrets.DASHBOARD_AUTH_PASSWORD }}
          # Optional: base64-encoded kubeconfig for the app to reach its cluster.
          # If unset, the role copies the on-host kubeconfig (k3s by default).
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: ./scripts/ansible-deploy.sh test
